name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build 'av>=16,<18' 'numpy>=1.26,<3'
      - run: python -m pytest -q
      - run: python -m pip install 'PySide6>=6.8,<7'
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
      - run: python -m pytest tests/surfaces/test_browser.py -q
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m build
      - run: telesthete-kvm --help
      - run: telesthete-surfaces --help
